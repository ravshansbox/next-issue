name: release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: bump
        run: |
          last=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          range=${last:+$last..HEAD}
          subjects=$(git log ${range:-HEAD} --format='%s')
          bodies=$(git log ${range:-HEAD} --format='%b')
          bump=""
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump=minor
          elif grep -qE '^fix(\([^)]*\))?:' <<<"$subjects"; then
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "The bump since ${last:-the first commit} is ${bump:-none}."
      - if: steps.bump.outputs.bump != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(npm version "${{ steps.bump.outputs.bump }}" -m "chore: release %s")
          git push --follow-tags
          gh release create "$tag" --title "$tag" --generate-notes
          npm publish
