name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - if: github.event_name == 'workflow_dispatch'
        run: |
          last=$(git describe --tags --match 'v*' --abbrev=0)
          npm version --no-git-tag-version --allow-same-version "${last#v}"
          npm publish
      - if: github.event_name == 'push'
        id: bump
        run: |
          last=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          range=${last:+$last..HEAD}
          subjects=$(git log ${range:-HEAD} --format='%s')
          bodies=$(git log ${range:-HEAD} --format='%b')
          bump=""
          if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -qE '^BREAKING[ -]CHANGE' <<<"$bodies"; then
            bump=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
            bump=minor
          elif grep -qE '^fix(\([^)]*\))?:' <<<"$subjects"; then
            bump=patch
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "The bump since ${last:-the first commit} is ${bump:-none}."
      - if: github.event_name == 'push' && steps.bump.outputs.bump != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=${{ steps.bump.outputs.last }}
          base=${last#v}
          npm version --no-git-tag-version --allow-same-version "${base:-0.0.0}"
          tag=$(npm version --no-git-tag-version "${{ steps.bump.outputs.bump }}")
          npm publish
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
