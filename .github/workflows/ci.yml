name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: .github/scripts/release-bump.test.sh
      - run: .github/scripts/repair-release.test.sh
      - run: .github/scripts/check-npm.test.sh
      - run: .github/scripts/wait-for-npm.test.sh
      - run: .github/scripts/release-notes.test.sh

  release:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: .github/scripts/check-npm.sh
      - run: npm ci --ignore-scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/repair-release.sh
      - if: github.event_name == 'push'
        id: bump
        run: .github/scripts/release-bump.sh
      - if: github.event_name == 'push' && steps.bump.outputs.bump != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.bump.outputs.last }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          last=$LAST
          base=${last#v}
          if [ -n "$base" ]; then
            .github/scripts/wait-for-npm.sh "$base" 600
          fi
          npm version --no-git-tag-version --allow-same-version -w next-issue "${base:-0.0.0}" > /dev/null
          npm version --no-git-tag-version -w next-issue "$BUMP" > /dev/null
          version=$(node -p "require('./packages/next-issue/package.json').version")
          npm version --no-git-tag-version --allow-same-version --workspaces "$version" > /dev/null
          tag="v$version"
          git tag "$tag"
          git push origin "$tag"
          npm publish --workspaces
          notes=$(.github/scripts/release-notes.sh "$tag")
          gh release create "$tag" --title "$tag" --notes-file - <<<"$notes"
